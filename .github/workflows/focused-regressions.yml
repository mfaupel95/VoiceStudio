name: Focused offline regressions
on:
  pull_request:
  push:
    branches: ["hermes/review-C-20261109", "main"]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run synthetic offline regressions
        run: |
          python -m pip install PyYAML==6.0.3
          python -B tests/test_container_publish_policy.py
          python -B tests/test_windows_device_aliases.py
          node --test tests/frontend/portableFilename.test.mjs
